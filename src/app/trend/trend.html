<div class="flex-row">
  <div hlmSidebarWrapper>
    <hlm-sidebar>
      <div hlmSidebarContent>
        <div hlmSidebarGroup>
          <div hlmSidebarGroupLabel>Application</div>
        </div>
      </div>
    </hlm-sidebar>
  </div>
  <div class="container" style="flex:1">
    <button hlmSidebarTrigger></button>
    <div class="flex-row" style="height: 100%;">
      <div class="flex-column" style="flex:1;row-gap: var(--gap);height: 100%;">
        <hlm-card class="flex-column" style="flex:1">
          <hlm-card-header>
            <h1 style="font-size: 1rem;">Temperatures</h1>
            <hlm-separator />
          </hlm-card-header>
          <div hlmTableContainer style="overflow-y: auto;max-height: 100%;">
            <table hlmTable>
              <thead hlmTableHeader class="sticky top-0 z-10" style="background-color: var(--table-header-background);">
                <tr hlmTableRow>
                  @for (column of _temperaturesColumns; track column) {
                  <th hlmTableHead>{{ column }}</th>
                  }
                </tr>
              </thead>
              <tbody hlmTableBody>
                @for (row of _temperaturesRows; track row) {
                <tr hlmTableRow>
                  <td hlmTableCell>{{ row.temperature }}</td>
                  <td hlmTableCell>{{ row.temperatureTime }}</td>
                </tr>
                }
              </tbody>
            </table>
          </div>
        </hlm-card>
        <hlm-card class="flex-column" style="flex:1">
          <hlm-card-header>
            <h1 style="font-size: 1rem;">Trend Data</h1>
            <hlm-separator />
          </hlm-card-header>
          <tanstack-chart hlmChart [options]="_chartOptions" style="flex: 1;" />
        </hlm-card>
      </div>
      <div class="flex-column" style="flex:1;align-items: center;">
        <hlm-card style="width: 100%;flex: 1;">
          <hlm-card-header>
            <h1 style="font-size: 1rem;">Temperatures</h1>
            <hlm-separator />
          </hlm-card-header>
          <tanstack-chart hlmChart [options]="_chartOptionsBar" style="flex: 1;" />
        </hlm-card>
      </div>
    </div>
  </div>
</div>
