<div class="page flex-row">
  <div hlmSidebarWrapper>
    <hlm-sidebar>
      <div hlmSidebarContent>
        <div hlmSidebarGroup>
          <div hlmSidebarGroupLabel>Application</div>
        </div>
      </div>
    </hlm-sidebar>
  </div>
  <div class="container">
    <button hlmSidebarTrigger></button>
    <div class="content flex-row">
      <div class="content-left flex-column">
        <hlm-card class="panel flex-column">
          <hlm-card-header>
            <h1 style="font-size: 1rem;">Temperatures</h1>
            <hlm-separator />
          </hlm-card-header>
          <div hlmTableContainer class="panel-body table-scroll">
            <table hlmTable>
              <thead hlmTableHeader class="sticky top-0 z-10" style="background-color: var(--table-header-background);">
                <tr hlmTableRow>
                  @for (column of _temperaturesColumns; track column) {
                  <th hlmTableHead>{{ column }}</th>
                  }
                </tr>
              </thead>
              <tbody hlmTableBody>
                @for (row of _temperaturesRows; track row) {
                <tr hlmTableRow>
                  <td hlmTableCell>{{ row.temperature }}</td>
                  <td hlmTableCell>{{ row.temperatureTime }}</td>
                </tr>
                }
              </tbody>
            </table>
          </div>
        </hlm-card>
        <hlm-card class="panel flex-column">
          <hlm-card-header>
            <h1 style="font-size: 1rem;">Trend Data</h1>
            <hlm-separator />
          </hlm-card-header>
          <div class="panel-body chart-host" #trendChartHost>
            <tanstack-chart hlmChart [options]="chartOptions()" />
          </div>
        </hlm-card>
      </div>
      <div class="content-right flex-column">
        <hlm-card class="panel flex-column">
          <hlm-card-header>
            <h1 style="font-size: 1rem;">Temperatures</h1>
            <hlm-separator />
          </hlm-card-header>
          <div class="panel-body chart-host" #barChartHost>
            <tanstack-chart hlmChart [options]="barChartOptions()" />
          </div>
        </hlm-card>
      </div>
    </div>
  </div>
</div>
